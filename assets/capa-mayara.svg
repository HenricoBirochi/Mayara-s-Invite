<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1900" role="img" aria-labelledby="title desc">
  <title id="title">Envelope de carta para o convite de Mayara</title>
  <desc id="desc">Envelope de papel marfim com aba triangular e acabamento dourado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9eb"/>
      <stop offset="1" stop-color="#ead5ad"/>
    </linearGradient>
    <linearGradient id="envelope" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f0dfbd"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffef9"/>
      <stop offset="1" stop-color="#ead6ae"/>
    </linearGradient>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1.1" fill="#89663f" opacity=".07"/>
      <circle cx="31" cy="30" r=".8" fill="#89663f" opacity=".06"/>
      <path d="M5 35l8-3M29 7l6 2" stroke="#89663f" opacity=".05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="20"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1900" fill="url(#bg)"/>
  <rect width="1200" height="1900" fill="url(#grain)"/>
  <rect x="34" y="34" width="1132" height="1832" fill="none" stroke="#9f7b4b" stroke-width="2" opacity=".45"/>
  <rect x="52" y="52" width="1096" height="1796" fill="none" stroke="#9f7b4b" opacity=".22"/>

  <g filter="url(#shadow)">
    <rect x="150" y="245" width="900" height="1250" rx="5" fill="url(#envelope)" stroke="#b9965f" stroke-width="3"/>
    <rect x="170" y="265" width="860" height="1210" fill="none" stroke="#d0b37d" stroke-width="2" opacity=".5"/>
    <path d="M153 249L600 850 1047 249" fill="url(#flap)" stroke="#c3a06a" stroke-width="3"/>
    <path d="M153 1491L480 1035M1047 1491L720 1035" fill="none" stroke="#c3a06a" stroke-width="3" opacity=".85"/>
    <path d="M153 249L600 850 1047 249" fill="none" stroke="#fffdf5" stroke-width="5" opacity=".6"/>
    <path d="M153 1491L480 1035M1047 1491L720 1035" fill="none" stroke="#fffdf5" stroke-width="4" opacity=".55"/>
  </g>

  <g fill="none" stroke="#a98757" stroke-linecap="round" opacity=".6">
    <path d="M55 165C145 55 260 48 350 112"/>
    <path d="M1145 165C1055 55 940 48 850 112"/>
    <path d="M55 1735C145 1845 260 1852 350 1788"/>
    <path d="M1145 1735C1055 1845 940 1852 850 1788"/>
  </g>
</svg>
